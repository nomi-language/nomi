# Runs on every push to main and every pull request.
#
# The Go packages run in the groups scripts/test-go-packages.sh defines, a
# job each on Linux and on Windows (the go matrix, whose groups the
# go-groups job reads from the script): internal/expectation,
# internal/analysis, internal/lsp, vmhost with internal/vm, and `rest`,
# every package no other job tests, which also runs go vet. As one job they
# shared a runner's four cores and took 29 minutes on Linux and 26 on
# Windows; internal/expectation, 150 s alone on a laptop, took 1368 s
# there. internal/irbuild is a job of its own on each system: it is the
# longest single package and needs more memory. Node 22 is installed on
# Linux so the tests that run a js/wasm build under node (cmd/nomi-wasm,
# internal/wasmsmoke, cmd/nomi's web builds) run instead of skipping.
#
# cmd/nomi runs in the parts scripts/test-cmd-nomi.sh defines, a job each
# on Linux and on Windows (the cmdnomi matrix, whose parts the
# cmdnomi-parts job reads from the script), and the go jobs leave it out.
# Most of its tests set the environment and so run one at a time. In one
# binary beside the go job's other packages it passed the go job's
# 40-minute limit on Linux with five tests left (over 2400 s), took 1970 s
# on Windows, and held back every later package's result. On a laptop
# running every step of scripts/check-full.sh at once, part 1 took about
# 570 s, parts 2 and 3 about 820 s between them, and lib 270 s. A part is
# expected to take under 20 minutes on a runner; each part's test binary
# has 30 minutes and its job 40.
#
# The lib part (TestLibModules) runs the Nomi tests of the modules under
# lib/, which hold no Go; its postgres runs skip, with no PostgreSQL on
# PATH.
#
# The tour job builds the tour's wasm bundle, which the go job lacks (the
# TestTourWasm* tests skip there), and checks it as `make test-tour` does.
#
# The windows-irbuild job runs the irbuild job's tests on Windows.
#
# Memory: a hosted runner has 4 cores and 16 GB, and each Linux job prints
# what it has (nproc, free -g) before it tests. go test runs -p 4 test
# binaries at once. Measured on macOS at GOMAXPROCS=4 with no limit, the
# go job's largest binaries peak at about 2.1 GB (internal/vm), 1.7 GB
# (internal/analysis), 1.6 GB (internal/lsp) and 1.5 GB (vmhost), and
# internal/irbuild at 6.5 GB, 3.3 GB of it live. GOMEMLIMIT is a soft limit
# per process below the runner's memory, so a binary's collector works
# harder before the kernel ends the runner: 3GiB for each binary of the go
# and cmdnomi jobs, and 4GiB for irbuild, which runs alone and then peaks
# at 4.4 GB.
#
# Not covered here: the tree-sitter grammar tests (scripts/tree-sitter.sh
# test) and the VS Code smoke test, which downloads VS Code.

name: test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The package groups, read from the script, so a group it adds runs here
  # with no change to this file.
  go-groups:
    name: the Go package groups
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      groups: ${{ steps.groups.outputs.groups }}
    steps:
      - uses: actions/checkout@v4
      - id: groups
        run: echo "groups=$(bash scripts/test-go-packages.sh groups | jq -R . | jq -s -c .)" >> "$GITHUB_OUTPUT"

  # Each group on Linux and on Windows; `rest` is every package no other
  # job tests, and runs go vet first. Git on Windows would check the tree
  # out with CRLF line ends, which every golden file and doctest compares
  # byte for byte, so autocrlf is off before the checkout. Windows has no
  # Node: the js/wasm tests skip there, as do the tour, VS Code and
  # tree-sitter checks, which run on Linux only. A Windows runner has the
  # same 4 cores and 16 GB and takes the same GOMEMLIMIT and -p, and a
  # longer limit.
  go:
    name: go test ${{ matrix.group }} on ${{ matrix.os }}
    needs: go-groups
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        group: ${{ fromJSON(needs.go-groups.outputs.groups) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: ${{ matrix.os == 'windows-latest' && 60 || 45 }}
    env:
      GOMEMLIMIT: 3GiB
    steps:
      - name: runner resources
        if: runner.os == 'Linux'
        run: |
          nproc
          free -g
      - if: runner.os == 'Windows'
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - if: runner.os == 'Linux'
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - if: matrix.group == 'rest'
        run: go vet ./...
      - name: go test
        shell: bash
        run: bash scripts/test-go-packages.sh "${{ matrix.group }}" -p 4 -timeout ${{ matrix.os == 'windows-latest' && '55m' || '40m' }}

  irbuild:
    name: go test ./internal/irbuild
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GOMEMLIMIT: 4GiB
    steps:
      - name: runner resources
        run: |
          nproc
          free -g
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go test -count=1 -timeout 40m ./internal/irbuild

  # cmd/nomi's parts, read from the script, so a part it adds runs here
  # with no change to this file.
  cmdnomi-parts:
    name: cmd/nomi's test parts
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      parts: ${{ steps.parts.outputs.parts }}
    steps:
      - uses: actions/checkout@v4
      - id: parts
        run: echo "parts=$(bash scripts/test-cmd-nomi.sh parts | jq -R . | jq -s -c .)" >> "$GITHUB_OUTPUT"

  # Each part on Linux and on Windows. On Windows, as in the go job,
  # autocrlf is off before the checkout and there is no Node; the script
  # runs under the bash that Git for Windows installs.
  cmdnomi:
    name: go test ./cmd/nomi part ${{ matrix.part }} on ${{ matrix.os }}
    needs: cmdnomi-parts
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        part: ${{ fromJSON(needs.cmdnomi-parts.outputs.parts) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    env:
      GOMEMLIMIT: 3GiB
    steps:
      - name: runner resources
        if: runner.os == 'Linux'
        run: |
          nproc
          free -g
      - if: runner.os == 'Windows'
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - if: runner.os == 'Linux'
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: go test
        shell: bash
        run: bash scripts/test-cmd-nomi.sh "${{ matrix.part }}" -timeout 30m

  # internal/irbuild on Windows, as the irbuild job runs it on Linux, with
  # autocrlf off before the checkout as in the go job.
  windows-irbuild:
    name: go test ./internal/irbuild on Windows
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      GOMEMLIMIT: 4GiB
    steps:
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go test -count=1 -timeout 55m ./internal/irbuild

  vscode:
    name: VS Code extension
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: editors/vscode/package-lock.json
      - run: npm --prefix editors/vscode ci
      - run: npm --prefix editors/vscode test

  tour:
    name: tour wasm bundle
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: ./scripts/build-tour-wasm.sh
      - run: go test -count=1 ./vmhost -run TestTourWasm
        env:
          NOMI_REQUIRE_TOUR_WASM: "1"
