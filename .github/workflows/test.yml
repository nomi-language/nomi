# Runs on every push to main and every pull request.
#
# internal/irbuild is its own job: it is the longest single package (about
# 100 s on a laptop), and run alongside cmd/nomi, internal/analysis and
# internal/lsp it would set the wall time of the whole run. Node 22 is installed so the
# tests that run a js/wasm build under node (cmd/nomi-wasm,
# internal/wasmsmoke) run instead of skipping.
#
# The tour job builds the tour's wasm bundle, which the go job lacks (the
# TestTourWasm* tests skip there), and checks it as `make test-tour` does.
#
# The go job's cmd/nomi TestLibModules runs the Nomi tests of the modules
# under lib/, which hold no Go; its postgres runs skip there, with no
# PostgreSQL on PATH.
#
# The windows and windows-irbuild jobs run the go and irbuild jobs' tests on
# Windows.
#
# Memory: a hosted runner has 4 cores and 16 GB, and each Linux job prints
# what it has (nproc, free -g) before it tests. go test runs -p 4 test
# binaries at once. Measured on macOS at GOMAXPROCS=4 with no limit, the
# go job's largest binaries peak at about 2.1 GB (internal/vm), 1.7 GB
# (internal/analysis), 1.6 GB (internal/lsp) and 1.5 GB (vmhost), and
# internal/irbuild at 6.5 GB, 3.3 GB of it live. GOMEMLIMIT is a soft limit
# per process below the runner's memory, so a binary's collector works
# harder before the kernel ends the runner: 3GiB for each of the go job's
# binaries, and 4GiB for irbuild, which runs alone and then peaks at 4.4 GB.
#
# Not covered here: the tree-sitter grammar tests (scripts/tree-sitter.sh
# test) and the VS Code smoke test, which downloads VS Code.

name: test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    name: go vet and go test (all but irbuild)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GOMEMLIMIT: 3GiB
    steps:
      - name: runner resources
        run: |
          nproc
          free -g
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: go vet ./...
      - name: go test
        run: go test -p 4 -count=1 -timeout 40m $(go list ./... | grep -v '/internal/irbuild$')

  irbuild:
    name: go test ./internal/irbuild
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GOMEMLIMIT: 4GiB
    steps:
      - name: runner resources
        run: |
          nproc
          free -g
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go test -count=1 -timeout 40m ./internal/irbuild

  # The Windows jobs run what the go and irbuild jobs run, split the same
  # way. Git would check the tree out with CRLF line ends, which every
  # golden file and doctest compares byte for byte, so autocrlf is off
  # before the checkout. No Node: the js/wasm tests skip, as do the tour,
  # VS Code and tree-sitter checks, which run on Linux only. A Windows
  # runner has the same 4 cores and 16 GB and takes the same GOMEMLIMIT
  # and -p.
  windows:
    name: go vet and go test on Windows (all but irbuild)
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      GOMEMLIMIT: 3GiB
    steps:
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - name: go test
        shell: bash
        run: go test -p 4 -count=1 -timeout 55m $(go list ./... | grep -v '/internal/irbuild$')

  windows-irbuild:
    name: go test ./internal/irbuild on Windows
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      GOMEMLIMIT: 4GiB
    steps:
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go test -count=1 -timeout 55m ./internal/irbuild

  vscode:
    name: VS Code extension
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: editors/vscode/package-lock.json
      - run: npm --prefix editors/vscode ci
      - run: npm --prefix editors/vscode test

  tour:
    name: tour wasm bundle
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: ./scripts/build-tour-wasm.sh
      - run: go test -count=1 ./vmhost -run TestTourWasm
        env:
          NOMI_REQUIRE_TOUR_WASM: "1"
