id = "nomi"
name = "Nomi"
version = "0.0.1"
schema_version = 1
authors = ["David Baldwin"]
description = "Syntax highlighting, language server and debugger support for the Nomi programming language"

[language_servers.nomi]
name = "Nomi LSP"
# TOML for a package's nomi.toml, a workspace's nomi-workspace.toml and phrase catalogs. Zed attaches a server
# by language, not by path, so the server sees every TOML buffer and answers
# only those two files and the ones under a package's `[i18n].catalogs` directory.
languages = ["Nomi", "TOML"]
language_ids = { "Nomi" = "nomi", "TOML" = "toml" }

# `nomi dap` (src/lib.rs get_dap_binary), configured as
# debug_adapter_schemas/Nomi.json describes.
[debug_adapters.Nomi]
schema_path = "debug_adapter_schemas/Nomi.json"

# Turns the `nomi run` and `nomi test` tasks into debug sessions.
[debug_locators.nomi]

[grammars.nomi]
repository = "https://github.com/nomi-language/tree-sitter-nomi"
rev = "07dbccd913eba87f6efb28180bffbdcd592dc6fa"
