[language-server.nomi-lsp]
command = "nomi-lsp"

[[language]]
name = "nomi"
language-id = "nomi"
scope = "source.nomi"
injection-regex = "nomi"
file-types = ["nomi"]
shebangs = ["nomi"]
roots = ["nomi.toml", "go.mod", ".git"]
comment-tokens = ["//", "///", "//!"]
indent = { tab-width = 4, unit = "    " }
text-width = 100
formatter = { command = "nomi", args = ["fmt"] }
language-servers = ["nomi-lsp"]

# `nomi dap`: Helix's :debug-start (space-G) offers these templates.
[language.debugger]
name = "nomi"
transport = "stdio"
command = "nomi"
args = ["dap"]

[[language.debugger.templates]]
name = "run"
request = "launch"
completion = [{ name = "program", completion = "filename", default = "." }]
args = { mode = "run", program = "{0}" }

[[language.debugger.templates]]
name = "test"
request = "launch"
completion = [
  { name = "test file", completion = "filename", default = "." },
  { name = "line of one test (empty for every test)", default = "" },
]
args = { mode = "test", program = "{0}", line = "{1}" }

[[grammar]]
name = "nomi"
source = { git = "https://github.com/nomi-language/tree-sitter-nomi", rev = "a85d07eb549038923c503cd223eb077e7c234237" }
