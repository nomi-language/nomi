[language-server.nomi-lsp]
command = "nomi-lsp"

[[language]]
name = "nomi"
language-id = "nomi"
scope = "source.nomi"
injection-regex = "nomi"
file-types = ["nomi"]
shebangs = ["nomi"]
roots = ["nomi.toml", "go.mod", ".git"]
comment-tokens = ["//", "///", "//!"]
indent = { tab-width = 4, unit = "    " }
text-width = 100
formatter = { command = "nomi", args = ["fmt"] }
language-servers = ["nomi-lsp"]

# `nomi dap`: Helix's :debug-start (space-G) offers these templates.
[language.debugger]
name = "nomi"
transport = "stdio"
command = "nomi"
args = ["dap"]

[[language.debugger.templates]]
name = "run"
request = "launch"
completion = [{ name = "program", completion = "filename", default = "." }]
args = { mode = "run", program = "{0}" }

[[language.debugger.templates]]
name = "test"
request = "launch"
completion = [
  { name = "test file", completion = "filename", default = "." },
  { name = "line of one test (empty for every test)", default = "" },
]
args = { mode = "test", program = "{0}", line = "{1}" }

# A module's message catalogs, the TOML files under `locales/`: Helix's
# TOML grammar, and nomi-lsp for their diagnostics, completion, hover and
# quick fixes. Helix picks a language by path, so a module whose
# `[i18n].catalogs` names another directory adds its own glob here.
[[language]]
name = "nomi-catalog"
scope = "source.toml.nomi-catalog"
grammar = "toml"
file-types = [{ glob = "locales/**/*.toml" }]
roots = ["nomi.toml"]
comment-tokens = ["#"]
indent = { tab-width = 2, unit = "  " }
language-servers = ["nomi-lsp"]

[[grammar]]
name = "nomi"
source = { git = "https://github.com/nomi-language/tree-sitter-nomi", rev = "0f64ecc1c848ce0dde65298f51fffca63bbff609" }
