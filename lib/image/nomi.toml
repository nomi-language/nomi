[module]
name = "image"
path = "github.com/nomi-language/nomi/lib/image"

# The module's public functions have no effects: each call runs its engine
# in a fresh WebAssembly instance with no imports (wasm.run), which acts on
# nothing. Its tests read their fixtures and write files.
[effects.self]
std = []
std_in_tests = ["std::fs"]

[effects.deps]
std = []
